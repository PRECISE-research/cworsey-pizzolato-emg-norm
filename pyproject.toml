[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carrall-worsey-pizzolato-emg-normalisation"
version = "0.1.2"
description = "Distribution-informed prediction and scaling of EMG linear envelopes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Matthew Carrall-Worsey" },
  { name = "Claudio Pizzolato" },
]
keywords = [
  "electromyography",
  "EMG",
  "normalisation",
  "kernel-density-estimation",
  "biomechanics",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyarrow>=14",
  "matplotlib>=3.7",
  "PyYAML>=6",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "ipykernel>=6"]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]

[project.scripts]
emg-normalisation = "emg_normalisation.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
