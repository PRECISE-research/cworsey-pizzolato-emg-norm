name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - run: git lfs pull --include="examples/full_trial_data/**"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: python examples/quick_start.py
      - run: >-
          python examples/predict_own_emg.py
          examples/full_trial_data/C06/trial_ffc10db23f/emgBPF.mot
          outputs/own_data_prediction.csv
          --amplifier-gain 1000
      - run: python examples/compare_prediction_modes.py
      - run: ruff check src tests examples
      - run: mkdocs build --strict
